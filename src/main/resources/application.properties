spring.application.name=StdManagement

# MySQL database connection.
# You can create the database in MySQL first:
# CREATE DATABASE student_management_db;
# The createDatabaseIfNotExist option can create it automatically if the user has permission.
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings.
# update creates/updates tables automatically while learning or developing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
application.security.jwt.expiration=7200000
application.security.jwt.refresh-expiration=604800000

# Backend server port.
server.port=8080

